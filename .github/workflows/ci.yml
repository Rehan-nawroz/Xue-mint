# CI for Xue-Mint
# Rule: do not commit or push without the user's explicit permission.

name: CI

on: [push, pull_request]

jobs:
  schema:
    name: Database schema — apply to a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration to a fresh SQLite database
        run: |
          which sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
          for migration in server/migrations/*.sql; do
            sqlite3 test.db < "$migration"
          done
          sqlite3 test.db ".tables"

  server:
    name: Server (Rust) — build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build and test server crate (activates once the crate exists)
        shell: bash
        run: |
          if [ -f server/Cargo.toml ]; then
            cd server && cargo build --locked && cargo test
          else
            echo "No server crate yet — nothing to build."
          fi

  web-and-shared:
    name: Web and Shared (TypeScript) — lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Lint, test and build shared and web
        if: hashFiles('package-lock.json') != ''
        run: |
          npm run lint
          npm run test
          npm run build

  mobile:
    name: Mobile (TypeScript) — lint, build and screenshots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Lint, typecheck and build mobile
        if: hashFiles('package-lock.json') != ''
        run: |
          npm run build -w @xue-mint/shared
          npm run lint -w @xue-mint/mobile
          npm run typecheck -w @xue-mint/mobile
          npm run build -w @xue-mint/mobile
      - name: Install Playwright Chromium
        if: hashFiles('package-lock.json') != ''
        run: npx playwright install chromium
      - name: Run screenshot and mock-flow tests
        if: hashFiles('package-lock.json') != ''
        run: npm run test:e2e -w @xue-mint/mobile
