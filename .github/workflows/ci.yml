# CI for Xue-Mint
# Rule: do not commit or push without the user's explicit permission.

name: CI

on: [push, pull_request]

jobs:
  schema:
    name: Database schema — apply to a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration to a fresh SQLite database
        run: |
          which sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
          sqlite3 test.db < server/migrations/0001_init.sql
          sqlite3 test.db ".tables"

  server:
    name: Server (Rust) — build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build and test server crate (activates once the crate exists)
        shell: bash
        run: |
          if [ -f server/Cargo.toml ]; then
            cd server && cargo build --locked && cargo test
          else
            echo "No server crate yet — nothing to build."
          fi

  web-and-shared:
    name: Web and Shared (TypeScript) — lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build shared package (activates once it exists)
        if: hashFiles('shared/package.json') != ''
        run: cd shared && npm install && npm run build
      - name: Lint and build web (activates once it exists)
        if: hashFiles('web/package.json') != ''
        run: cd web && npm install && npm run lint && npm run build
