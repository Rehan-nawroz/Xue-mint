[package]
name = "xue-mint-server"
version = "0.1.0"
edition = "2021"
description = "Personal photo backup server: stores photos as plain files, serves an HTTPS API on the local network"

[lib]
name = "xue_mint_server"
path = "src/lib.rs"

[[bin]]
name = "xue-mint-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
notify = "7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.5"
percent-encoding = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
if-addrs = "0.15.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }
